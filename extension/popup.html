
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Popup configuration -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aamen - آمن</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <!-- Aamen branding and bilingual language controls -->
  <header class="hdr">
    <div class="brand">
      <h1 id="appTitle">Aamen</h1>
      <p id="description">T&C and Privacy Policy Extraction</p>
    </div>

    <div class="language-buttons">
      <button id="englishButton" type="button">EN</button>
      <button id="arabicButton" type="button">ع</button>
    </div>
  </header>

  <main class="container">

    <!-- WP2: Backend server configuration -->
    <section class="card" id="serverSection">
      <h2 id="serverTitle">Backend Server Settings</h2>

      <label for="serverUrl" id="serverLabel">Backend URL</label>

      <input
        type="url"
        id="serverUrl"
        placeholder="http://192.168.1.5:8000"
        autocomplete="off"
        spellcheck="false"
      >

      <div class="server-actions">
        <button id="saveServerButton" type="button">Save Server</button>
        <button id="checkServerButton" type="button">Check Connection</button>
      </div>

      <p id="backendStatus" role="status" aria-live="polite">
        Not connected.
      </p>
    </section>

    <!-- WP1: Legal document extraction -->
    <section class="card">
      <h2 id="extractionTitle">Legal Document Extraction</h2>
      <button id="analyzeButton" type="button">Analyze Current Page</button>
      <p id="status" role="status" aria-live="polite">
        Ready to extract.
      </p>
    </section>

    <!-- WP1: Extracted text and manual paste fallback -->
    <section class="card">
      <h2 id="previewTitle">Extracted Legal Text</h2>
      <p id="pageTitle"></p>
      <p id="manualHelp">
        You can paste legal text manually if extraction fails.
      </p>

      <textarea
        id="termsInput"
        rows="10"
        placeholder="Extracted Terms & Conditions or Privacy Policy text will appear here."
      ></textarea>
    </section>

    <!-- WP1: Discovered legal links -->
    <section class="card">
      <h2 id="linksTitle">Discovered Legal Documents</h2>
      <ul id="legalLinksList"></ul>
    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <p id="footerText">Aamen — Legal document extraction</p>
  </footer>

  <!-- Extension functionality -->
  <script src="popup.js"></script>
</body>
</html>
